      description: "Create a new pipeline for a specified object type in your HubSpot\
        \ account. This endpoint requires a JSON request body with details about the\
        \ pipeline, including its label, display order, and stages. The operation\
        \ returns the newly created pipeline's details upon success."
      operationId: PostPipelines
      parameters:
      - description: "The type of object for which the pipeline is being created,\
          \ such as deals or tickets."
        explode: false
        in: path
        name: objectType
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
          description: successful operation
          headers:
            Location:
              description: URL of the newly created resource

  /crm/pipelines/2026-09/{objectType}/{pipelineId}:
    delete:
      description: Delete a specific pipeline in your HubSpot account identified by
        its object type and pipeline ID. This operation can optionally validate references
        and deal stage usages before deletion to ensure data integrity.
      operationId: DeletePipelines
      parameters:
      - description: "The type of object the pipeline belongs to, such as deals or\
          \ tickets."
        explode: false
        in: path
        name: objectType
        required: true
        schema:
          type: string
        style: simple
      - description: The unique identifier of the pipeline to delete.
        explode: false
        in: path
        name: pipelineId
        required: true
        schema:
          type: string
        style: simple
      - description: A boolean indicating whether to validate deal stage usages before
          deleting the pipeline. Defaults to true.
        explode: true
        in: query
        name: validateDealStageUsagesBeforeDelete
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: A boolean indicating whether to validate references before deleting
          the pipeline. Defaults to true.
        explode: true
        in: query
        name: validateReferencesBeforeDelete
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "204":
          content: {}
          description: No content
        default:
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Error"
          description: An error occurred.

      description: Represents an error response returned by the API when an operation
        fails. This component is used in various endpoints to provide detailed information
        about the error encountered.
      example:
        category: VALIDATION_ERROR
        correlationId: aeb5f871-7f07-4993-9211-075dc63e7cbf
        links:
          knowledge-base: https://www.hubspot.com/products/service/knowledge-base
        message: Invalid input (details will vary based on the error)
      properties:
        category:
          description: The error category.
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: "Context about the error condition, represented as an object\
            \ with additional properties."
          example: "{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}"
          type: object
        correlationId:
          description: A unique identifier for the request. Include this value with
            any error reports or support tickets.
          example: aeb5f871-7f07-4993-9211-075dc63e7cbf
          format: uuid
          type: string
        errors:
          description: "Further information about the error, represented as an array\
            \ of ErrorDetail objects."
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        links:
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation
            about the error or recommended remediation steps.
          type: object
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate.
          example: An error occurred
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error.
          type: string
      required:
      - category
      - correlationId
      - message
      type: object
    ErrorDetail:
      description: "Represents detailed information about an error that occurred in\
        \ the API. This component is used to provide additional context and specifics\
        \ about errors, typically as part of an error response."
      properties:
        code:
          description: The status code associated with the error detail.
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: "Context about the error condition, represented as an object\
            \ with additional properties that are arrays of strings."
          example: "{missingScopes=[scope1, scope2]}"
          type: object
        in:
          description: The name of the field or parameter in which the error was found.
          type: string
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate.
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error.
          type: string
      required:
      - message
      type: object

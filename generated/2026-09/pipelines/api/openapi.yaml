    patch:
      description: "Update an existing pipeline in your HubSpot account. This endpoint\
        \ allows you to modify specific properties of a pipeline, such as its label,\
        \ display order, or archived status. Use this to keep your pipeline data up-to-date\
        \ and organized."
      operationId: PatchPipelines
      parameters:
      - description: "The type of object associated with the pipeline, such as deals\
          \ or tickets."
        explode: false
        in: path
        name: objectType
        required: true
        schema:
          type: string
        style: simple
      - description: The unique identifier of the pipeline to update.
        explode: false
        in: path
        name: pipelineId
        required: true
        schema:
          type: string
        style: simple
      - description: A boolean indicating whether to validate deal stage usages before
          deleting. Defaults to true.
        explode: true
        in: query
        name: validateDealStageUsagesBeforeDelete
        required: false
        schema:
          default: true
          type: boolean
        style: form

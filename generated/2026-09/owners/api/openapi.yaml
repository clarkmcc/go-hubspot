openapi: 3.0.1
info:
  description: Owners - Parent pom
  title: Crm Owners
  version: 2026-09
  x-hubspot-api-use-case: Retrieve the owner IDs for all users in the account to later
    assign CRM records across the team.
  x-hubspot-introduction: "Each user in a HubSpot account is assigned an owner ID,\
    \ which HubSpot uses to map the user to their assigned CRM records, activities,\
    \ and more. Use the owners API to retrieve owner IDs and other related information\
    \ for users in the account. To assign an owner to a CRM record, you can use the\
    \ properties API to set the hubspot_owner_id property."
  x-hubspot-product-tier-requirements:
    cms: FREE
    commerce: FREE
    crmHub: FREE
    dataHub: FREE
    marketing: FREE
    sales: FREE
    service: FREE
servers:
- url: https://api.hubapi.com
tags:
- name: Basic
paths:
  /crm/owners/2026-09:
    get:
      description: Retrieve a paginated list of owners from your HubSpot account.
        This endpoint allows filtering by email and supports pagination through the
        'after' parameter. You can also specify the maximum number of results per
        page and choose to include archived owners in the response.
      operationId: GetOwners
      parameters:
      - description: The paging cursor token of the last successfully read resource
          will be returned as the `paging.next.after` JSON property of a paged response
          containing more results.
        explode: true
        in: query
        name: after
        required: false
        schema:
          type: string
        style: form
      - description: Whether to return only results that have been archived.
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Filter by email address (optional)
        explode: true
        in: query
        name: email
        required: false
        schema:
          type: string
        style: form
      - description: The maximum number of results to display per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponsePublicOwnerForwardPaging"
          description: successful operation
        default:
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Error"
          description: An error occurred.
      security:
      - oauth2:
        - automation
      - oauth2:
        - crm.objects.owners.read
      - oauth2:
        - crm.pipelines.approval.read
      - oauth2:
        - crm.pipelines.governance.write
      summary: List owners
      tags:
      - Basic
      x-hubspot-user-level-auth:
        internalOnly: false
  /crm/owners/2026-09/{ownerId}:
    get:
      description: Retrieve details of a specific owner using either their 'id' or
        'userId'.
      operationId: GetOwnersByOwnerId
      parameters:
      - description: The unique identifier of the owner to retrieve.
        explode: false
        in: path
        name: ownerId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: Whether to return only results that have been archived.
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Specifies which property to use for identifying the owner. Valid
          values are 'id' or 'userId'. Defaults to 'id'.
        explode: true
        in: query
        name: idProperty
        required: false
        schema:
          default: id
          enum:
          - id
          - userId
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOwner"
          description: successful operation
        default:
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Error"
          description: An error occurred.
      security:
      - oauth2:
        - automation
      - oauth2:
        - crm.objects.owners.read
      - oauth2:
        - crm.pipelines.approval.read
      - oauth2:
        - crm.pipelines.governance.write
      summary: Retrieve a specific owner by ID
      tags:
      - Basic
components:
  responses:
    Error:
      content:
        '*/*':
          schema:
            $ref: "#/components/schemas/Error"
      description: An error occurred.
  schemas:
    CollectionResponsePublicOwnerForwardPaging:
      example:
        paging:
          next:
            after: after
            link: link
        results:
        - archived: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          email: email
          firstName: firstName
          id: id
          lastName: lastName
          teams:
          - id: id
            name: name
            primary: true
          - id: id
            name: name
            primary: true
          type: PERSON
          updatedAt: 2000-01-23T04:56:07.000+00:00
          userId: 0
          userIdIncludingInactive: 6
        - archived: true
          createdAt: 2000-01-23T04:56:07.000+00:00
          email: email
          firstName: firstName
          id: id
          lastName: lastName
          teams:
          - id: id
            name: name
            primary: true
          - id: id
            name: name
            primary: true
          type: PERSON
          updatedAt: 2000-01-23T04:56:07.000+00:00
          userId: 0
          userIdIncludingInactive: 6
      properties:
        paging:
          $ref: "#/components/schemas/ForwardPaging"
        results:
          description: "An array of PublicOwner objects, each representing an individual\
            \ owner with their specific details."
          items:
            $ref: "#/components/schemas/PublicOwner"
          type: array
      required:
      - results
      type: object
    Error:
      description: Represents an error response returned by the API when an operation
        fails. This component is used in various endpoints to provide detailed information
        about the error encountered.
      example:
        category: VALIDATION_ERROR
        correlationId: aeb5f871-7f07-4993-9211-075dc63e7cbf
        links:
          knowledge-base: https://www.hubspot.com/products/service/knowledge-base
        message: Invalid input (details will vary based on the error)
      properties:
        category:
          description: The error category
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: Context about the error condition
          example: "{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}"
          type: object
        correlationId:
          description: A unique identifier for the request. Include this value with
            any error reports or support tickets
          example: aeb5f871-7f07-4993-9211-075dc63e7cbf
          format: uuid
          type: string
        errors:
          description: further information about the error
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        links:
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation
            about the error or recommended remediation steps
          type: object
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate
          example: An error occurred
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error
          type: string
      required:
      - category
      - correlationId
      - message
      type: object
    ErrorDetail:
      description: "Represents detailed information about an error that occurred in\
        \ the API. This component is used to provide additional context and specifics\
        \ about errors, typically as part of an error response."
      properties:
        code:
          description: The status code associated with the error detail
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: Context about the error condition
          example: "{missingScopes=[scope1, scope2]}"
          type: object
        in:
          description: The name of the field or parameter in which the error was found.
          type: string
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error
          type: string
      required:
      - message
      type: object
    ForwardPaging:
      description: Paging information for forward-only pagination. Contains the next
        page reference when more results are available; omitted or empty on the last
        page.
      example:
        next:
          after: after
          link: link
      properties:
        next:
          $ref: "#/components/schemas/NextPage"
      type: object
    NextPage:
      description: Specifies the paging information needed to retrieve the next set
        of results in a paginated API response
      example:
        after: after
        link: link
      properties:
        after:
          description: "A string token used as a cursor for pagination, indicating\
            \ the position after the last item on the current page."
          type: string
        link:
          description: A string containing the URL link to the next page of results.
          type: string
      required:
      - after
      type: object
    PublicOwner:
      example:
        archived: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        email: email
        firstName: firstName
        id: id
        lastName: lastName
        teams:
        - id: id
          name: name
          primary: true
        - id: id
          name: name
          primary: true
        type: PERSON
        updatedAt: 2000-01-23T04:56:07.000+00:00
        userId: 0
        userIdIncludingInactive: 6
      properties:
        archived:
          description: Indicates whether the owner is archived.
          type: boolean
        createdAt:
          description: The date and time when the owner was created.
          format: date-time
          type: string
        email:
          description: The email address of the owner.
          type: string
        firstName:
          description: The first name of the owner.
          type: string
        id:
          description: The unique identifier of the owner.
          type: string
        lastName:
          description: The last name of the owner.
          type: string
        teams:
          description: "An array of teams associated with the owner, where each team\
            \ is represented by a PublicTeam object."
          items:
            $ref: "#/components/schemas/PublicTeam"
          type: array
        type:
          description: "The type of the owner, which can be either PERSON or QUEUE."
          enum:
          - PERSON
          - QUEUE
          type: string
        updatedAt:
          description: The date and time when the owner was last updated.
          format: date-time
          type: string
        userId:
          description: The user ID of the owner.
          format: int32
          type: integer
        userIdIncludingInactive:
          description: "The user ID of the owner, including inactive users."
          format: int32
          type: integer
      required:
      - archived
      - createdAt
      - id
      - type
      - updatedAt
      type: object
    PublicTeam:
      example:
        id: id
        name: name
        primary: true
      properties:
        id:
          description: "The unique identifier for the team, represented as a string."
          type: string
        name:
          description: "The name of the team, represented as a string."
          type: string
        primary:
          description: A boolean indicating whether this team is the primary team.
          type: boolean
      required:
      - id
      - name
      - primary
      type: object
  securitySchemes:
    developer_hapikey:
      in: query
      name: hapikey
      type: apiKey
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://app.hubspot.com/oauth/authorize
          scopes:
            automation: ""
            crm.objects.owners.read: ""
            crm.pipelines.approval.read: ""
            crm.pipelines.governance.write: ""
          tokenUrl: https://api.hubapi.com/oauth/v1/token
      type: oauth2
      x-hubspot-app-availability:
        automation:
          developer: false
          portal:
          - public
          - private
        crm.objects.owners.read:
          developer: true
          portal:
          - public
          - private
          user:
          - public
          - private
        crm.pipelines.approval.read:
          developer: false
          portal:
          - public
          - private
        crm.pipelines.governance.write:
          developer: false
          portal:
          - public
          - private
x-hubspot-available-client-libraries:
- Node
- Python
- Ruby
- PHP
x-hubspot-product-tier-requirements:
  cms: FREE
  commerce: FREE
  crmHub: FREE
  dataHub: FREE
  marketing: FREE
  sales: FREE
  service: FREE

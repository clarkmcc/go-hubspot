    delete:
      description: "Move an Object identified by `{objectId}` to the recycling bin.\
        \ This operation allows you to archive a specific CRM object by its unique\
        \ identifier, effectively removing it from active use while retaining it in\
        \ the system for potential recovery or auditing purposes."

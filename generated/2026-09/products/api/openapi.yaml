  /crm/objects/2026-09/products/batch/create:
    post:
      description: "Create a batch of CRM objects with the specified properties. This\
        \ endpoint allows for the creation of multiple objects in a single request,\
        \ which can be useful for efficiently importing large datasets or synchronizing\
        \ data from external systems. The response includes the created objects with\
        \ their IDs."
      operationId: PostProductsBatchCreate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInputSimplePublicObjectBatchInputForCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponseSimplePublicObject"
          description: successful operation
        "207":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponseSimplePublicObjectWithErrors"
          description: multiple statuses
        default:
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Error"
          description: An error occurred.
      security:
      - oauth2:
        - crm.objects.tickets.write
      - oauth2:
        - crm.objects.tickets.read
      - oauth2:
        - crm.objects.deals.read
      - oauth2:
        - crm.objects.services.read
      - oauth2:
        - crm.objects.subscriptions.read
      - oauth2:
        - crm.objects.tickets.sensitive.read
      - oauth2:

components:
  responses:
    Error:
      content:
        '*/*':
          schema:
            $ref: "#/components/schemas/Error"
      description: An error occurred.
  schemas:
    AssociatedId:
      description: Contains the id and type of an association
      example:
        id: id
        type: deal_to_contact
      properties:
        id:
          description: The unique identifier for the associated object. It is a string.
          type: string
        type:
          description: The type of the associated object. It is a string.
          example: deal_to_contact
          type: string
      required:
      - id
      - type
      type: object
    AssociationSpec:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        associationCategory: HUBSPOT_DEFINED
        associationTypeId: 0
      properties:
        associationCategory:
          description: "The category of the association, indicating its origin or\
            \ purpose. Valid values include 'HUBSPOT_DEFINED', 'USER_DEFINED', 'INTEGRATOR_DEFINED',\
            \ and 'WORK'."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        associationTypeId:
          description: An integer representing the specific type of association between
            objects.
          format: int32
          type: integer
      required:
      - associationCategory
      - associationTypeId
      type: object
    AssociationSpecWithLabel:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        category: HUBSPOT_DEFINED
        fromObjectTypeId: fromObjectTypeId
        label: label
        toObjectTypeId: toObjectTypeId
        typeId: 0
      properties:
        category:
          description: "The category of the association, which can be one of 'HUBSPOT_DEFINED',\
            \ 'USER_DEFINED', 'INTEGRATOR_DEFINED', or 'WORK'."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        fromObjectTypeId:
          description: The object type ID of the source object in the association.
          type: string
        label:
          description: A string label that can be used to describe the association.
          type: string
        toObjectTypeId:
          description: The object type ID of the target object in the association.
          type: string
        typeId:
          description: An integer representing the unique identifier for the association
            type.
          format: int32
          type: integer
      required:
      - category
      - typeId
      type: object
    BatchInputSimplePublicObjectBatchInput:
      description: "Represents a batch input component used to handle multiple simple\
        \ public objects in a single API request. This component is typically used\
        \ when performing batch operations to create, update, or delete multiple records\
        \ simultaneously."
      example:
        inputs:
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInput items, each containing\
            \ the properties and identifiers necessary for updating a specific CRM\
            \ object."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInput"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputForCreate:
      description: Represents a batch input for creating multiple simple public objects
        in a single request. This component is used to streamline the process of adding
        new objects to a HubSpot account by allowing multiple entries to be created
        at once.
      example:
        inputs:
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInputForCreate objects,\
            \ each containing the properties and associations needed to create a single\
            \ CRM object."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputForCreate"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputUpsert:
      description: "Represents a batch input operation for upserting simple public\
        \ objects in HubSpot. This component is used to process multiple upsert operations\
        \ in a single request, improving efficiency and performance."
      example:
        inputs:
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: An array of SimplePublicObjectBatchInputUpsert objects. Each
            object in the array contains the properties and identifiers needed for
            the upsert operation.
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputUpsert"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectId:
      description: Represents a batch input payload containing a list of simple public
        object IDs. This component is used when performing batch operations on multiple
        objects within HubSpot.
      example:
        inputs:
        - id: "430001"
        - id: "430001"
      properties:
        inputs:
          description: "An array of SimplePublicObjectId objects, each representing\
            \ the ID of a public object to be processed in the batch operation."
          items:
            $ref: "#/components/schemas/SimplePublicObjectId"
          type: array
      required:
      - inputs
      type: object
    BatchReadInputSimplePublicObjectId:
      description: "Specifies the input for reading a batch of CRM objects, including\
        \ arrays of object IDs, requested property names (with optional history),\
        \ and an optional unique identifying property."
      example:
        idProperty: idProperty
        inputs:
        - id: "430001"
        - id: "430001"
        properties:
        - properties
        - properties
        propertiesWithHistory:
        - propertiesWithHistory
        - propertiesWithHistory
      properties:
        idProperty:
          description: "When using a custom unique value property to retrieve records,\
            \ the name of the property. Do not include this parameter if retrieving\
            \ by record ID."
          type: string
        inputs:
          description: An array of SimplePublicObjectId objects representing the IDs
            of the objects to be read.
          items:
            $ref: "#/components/schemas/SimplePublicObjectId"
          type: array
        properties:
          description: "An array of strings representing the properties to be returned\
            \ in the response. If a specified property is not present on the requested\
            \ objects, it will be ignored."
          items:
            type: string
          type: array
        propertiesWithHistory:
          description: "An array of strings representing the properties to be returned\
            \ along with their history of previous values. If a specified property\
            \ is not present on the requested objects, it will be ignored."
          items:
            type: string
          type: array

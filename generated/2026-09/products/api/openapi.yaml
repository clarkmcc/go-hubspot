        category:
          description: The error category
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: Context about the error condition
          example: "{invalidPropertyName=[propertyValue], missingScopes=[scope1, scope2]}"
          type: object
        correlationId:
          description: A unique identifier for the request. Include this value with
            any error reports or support tickets
          example: aeb5f871-7f07-4993-9211-075dc63e7cbf
          format: uuid
          type: string
        errors:
          description: further information about the error
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        links:
          additionalProperties:
            type: string
          description: A map of link names to associated URIs containing documentation
            about the error or recommended remediation steps
          type: object
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate
          example: An error occurred
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error
          type: string
      required:
      - category
      - correlationId
      - message
      type: object
    ErrorDetail:
      description: "Represents detailed information about an error that occurred in\
        \ the API. This component is used to provide additional context and specifics\
        \ about errors, typically as part of an error response."
      example:
        code: code
        context: "{missingScopes=[scope1, scope2]}"
        in: in
        message: message
        subCategory: subCategory
      properties:
        code:
          description: The status code associated with the error detail
          type: string
        context:
          additionalProperties:
            items:
              type: string
            type: array
          description: Context about the error condition
          example: "{missingScopes=[scope1, scope2]}"
          type: object
        in:
          description: The name of the field or parameter in which the error was found.
          type: string
        message:
          description: A human readable message describing the error along with remediation
            steps where appropriate
          type: string
        subCategory:
          description: A specific category that contains more specific detail about
            the error
          type: string
      required:
      - message
      type: object
    Filter:
      description: "Defines a single condition for searching CRM objects, specifying\
        \ the property to filter on, the operator to use (such as equals, greater\
        \ than, or contains), and the value(s) to compare against. "
      example:
        highValue: highValue
        operator: BETWEEN
        propertyName: propertyName
        value: value
        values:
        - values
        - values
      properties:
        highValue:
          description: An optional string representing the upper bound value for range-based
            filters.
          type: string
        operator:
          description: "The operator used for the filter condition. It is a string\
            \ and valid values include 'EQ', 'NEQ', 'LT', 'LTE', 'GT', 'GTE', 'BETWEEN',\
            \ 'IN', 'NOT_IN', 'HAS_PROPERTY', 'NOT_HAS_PROPERTY', 'CONTAINS_TOKEN',\
            \ and 'NOT_CONTAINS_TOKEN'."
          enum:
          - BETWEEN
          - CONTAINS_TOKEN
          - EQ
          - GT
          - GTE
          - HAS_PROPERTY
          - IN
          - LT
          - LTE
          - NEQ
          - NOT_CONTAINS_TOKEN
          - NOT_HAS_PROPERTY
          - NOT_IN
          type: string
        propertyName:
          description: The name of the property to filter by. It is a string that
            identifies which property of the object the filter applies to.
          type: string
        value:
          description: The specific value to filter for. This is a string that represents
            the target value for the specified property.
          type: string
        values:
          description: "An array of strings representing multiple values for the filter.\
            \ This is used when the filter operator supports multiple values, such\
            \ as 'IN' or 'NOT_IN'."
          items:
            type: string
          type: array
      required:
      - operator
      - propertyName
      type: object

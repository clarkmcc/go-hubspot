    AssociatedId:
      description: Contains the id and type of an association
      example:
        id: id
        type: deal_to_contact
      properties:
        id:
          description: The ID for the association type.
          type: string
        type:
          description: The type of association.
          example: deal_to_contact
          type: string
      required:
      - id
      - type
      type: object
    AssociationSpec:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        associationCategory: HUBSPOT_DEFINED
        associationTypeId: 6
      properties:
        associationCategory:
          description: "The category of the association, such as \"HUBSPOT_DEFINED\"\
            ."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        associationTypeId:
          description: The ID representing the specific type of association.
          format: int32
          type: integer
      required:
      - associationCategory
      - associationTypeId
      type: object
    AssociationSpecWithLabel:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        category: HUBSPOT_DEFINED
        fromObjectTypeId: fromObjectTypeId
        label: label
        toObjectTypeId: toObjectTypeId
        typeId: 0
      properties:
        category:
          description: "The category of the association, such as HUBSPOT_DEFINED,\
            \ USER_DEFINED, or INTEGRATOR_DEFINED."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        fromObjectTypeId:
          description: A string representing the object type ID from which the association
            originates.
          type: string
        label:
          description: A label describing the association between two objects.
          type: string
        toObjectTypeId:
          description: A string representing the object type ID to which the association
            is directed.
          type: string
        typeId:
          description: The unique identifier for the type of association.
          format: int32
          type: integer
      required:
      - category
      - typeId
      type: object
    BatchInputPublicAssociationDefinitionConfigurationCreateRequest:

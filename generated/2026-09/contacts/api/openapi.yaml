  /crm/objects/2026-09/contacts/batch/create:
    post:
      description: "Create a batch of contacts. The `inputs` array can contain a `properties`\
        \ object to define property values for each record, along with an `associations`\
        \ array to define [associations](https://developers.hubspot.com/docs/guides/api/crm/associations/associations-v4)\
        \ with other CRM records."
      operationId: BatchCreate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInputSimplePublicObjectBatchInputForCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponseSimplePublicObject"
          description: successful operation
        "207":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResponseSimplePublicObjectWithErrors"
          description: multiple statuses
        default:
          content:
            '*/*':

    Filter:
      description: "Defines a single condition for searching CRM objects, specifying\
        \ the property to filter on, the operator to use (such as equals, greater\
        \ than, or contains), and the value(s) to compare against. "
      example:
        highValue: highValue
        operator: BETWEEN
        propertyName: propertyName
        value: value
        values:
        - values
        - values
      properties:
        highValue:
          description: "An optional string representing the upper bound of a range\
            \ filter, used when the operator is 'BETWEEN'."
          type: string
        operator:
          description: "The operator used to compare the property value. It is a string\
            \ and valid values include 'EQ', 'NEQ', 'LT', 'LTE', 'GT', 'GTE', 'BETWEEN',\
            \ 'IN', 'NOT_IN', 'HAS_PROPERTY', 'NOT_HAS_PROPERTY', 'CONTAINS_TOKEN',\
            \ and 'NOT_CONTAINS_TOKEN'."
          enum:
          - BETWEEN
          - CONTAINS_TOKEN
          - EQ
          - GT
          - GTE
          - HAS_PROPERTY
          - IN
          - LT
          - LTE
          - NEQ
          - NOT_CONTAINS_TOKEN
          - NOT_HAS_PROPERTY
          - NOT_IN
          type: string
        propertyName:
          description: The name of the property to filter on. It is a string that
            specifies which object property the filter applies to.
          type: string
        value:
          description: The value to compare against the specified property. It is
            a string used in conjunction with the operator to determine matching results.
          type: string
        values:
          description: "An array of strings representing multiple values to compare\
            \ against the specified property, used with operators like 'IN' or 'NOT_IN'."
          items:
            type: string
          type: array
      required:

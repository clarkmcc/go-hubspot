components:
  responses:
    Error:
      content:
        '*/*':
          schema:
            $ref: "#/components/schemas/Error"
      description: An error occurred.
  schemas:
    AssociatedId:
      description: Contains the id and type of an association
      example:
        id: id
        type: deal_to_contact
      properties:
        id:
          description: The unique identifier for the associated object. This is a
            string value.
          type: string
        type:
          description: The type of association between the objects. This is a string
            value.
          example: deal_to_contact
          type: string
      required:
      - id
      - type
      type: object
    AssociationSpec:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        associationCategory: HUBSPOT_DEFINED
        associationTypeId: 0
      properties:
        associationCategory:
          description: "The category of the association, indicating its origin or\
            \ purpose. Valid values include 'HUBSPOT_DEFINED', 'USER_DEFINED', 'INTEGRATOR_DEFINED',\
            \ and 'WORK'."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        associationTypeId:
          description: An integer representing the unique identifier for the type
            of association.
          format: int32
          type: integer
      required:
      - associationCategory
      - associationTypeId
      type: object
    AssociationSpecWithLabel:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        category: HUBSPOT_DEFINED
        fromObjectTypeId: fromObjectTypeId
        label: label
        toObjectTypeId: toObjectTypeId
        typeId: 0
      properties:
        category:
          description: "The category of the association. Valid values include 'HUBSPOT_DEFINED',\
            \ 'USER_DEFINED', 'INTEGRATOR_DEFINED', and 'WORK'."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        fromObjectTypeId:
          description: A string representing the type ID of the object from which
            the association originates.
          type: string
        label:
          description: A string representing the label for the association.
          type: string
        toObjectTypeId:
          description: A string representing the type ID of the object to which the
            association is directed.
          type: string
        typeId:
          description: An integer representing the unique identifier for the association
            type.
          format: int32
          type: integer
      required:
      - category
      - typeId
      type: object
    BatchInputSimplePublicObjectBatchInput:
      description: "Represents a batch input component used to handle multiple simple\
        \ public objects in a single API request. This component is typically used\
        \ when performing batch operations to create, update, or delete multiple records\
        \ simultaneously."
      example:
        inputs:
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: An array of SimplePublicObjectBatchInput objects. Each object
            contains the properties and identifiers necessary for processing a batch
            update operation.
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInput"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputForCreate:
      description: Represents a batch input for creating multiple simple public objects
        in a single request. This component is used to streamline the process of adding
        new objects to a HubSpot account by allowing multiple entries to be created
        at once.
      example:
        inputs:
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of objects, each representing a CRM object to be\
            \ created. Each object includes properties and associations necessary\
            \ for the creation process."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputForCreate"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputUpsert:
      description: "Represents a batch input operation for upserting simple public\
        \ objects in HubSpot. This component is used to process multiple upsert operations\
        \ in a single request, improving efficiency and performance."
      example:
        inputs:
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInputUpsert objects, each\
            \ containing the properties and identifiers needed for the upsert operation."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputUpsert"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectId:
      description: Represents a batch input payload containing a list of simple public
        object IDs. This component is used when performing batch operations on multiple
        objects within HubSpot.
      example:
        inputs:
        - id: "430001"
        - id: "430001"
      properties:
        inputs:
          description: "An array of SimplePublicObjectId objects, each representing\
            \ a unique identifier for a CRM object. This array is required for batch\
            \ processing operations."
          items:
            $ref: "#/components/schemas/SimplePublicObjectId"
          type: array
      required:
      - inputs
      type: object
    BatchReadInputSimplePublicObjectId:
      description: "Specifies the input for reading a batch of CRM objects, including\
        \ arrays of object IDs, requested property names (with optional history),\
        \ and an optional unique identifying property."
      example:
        idProperty: idProperty
        inputs:
        - id: "430001"
        - id: "430001"
        properties:
        - properties
        - properties
        propertiesWithHistory:
        - propertiesWithHistory
        - propertiesWithHistory
      properties:
        idProperty:
          description: "When using a custom unique value property to retrieve records,\
            \ the name of the property. Do not include this parameter if retrieving\
            \ by record ID."
          type: string
        inputs:
          description: "An array of SimplePublicObjectId objects, each containing\
            \ an ID of an object to be read."
          items:
            $ref: "#/components/schemas/SimplePublicObjectId"
          type: array
        properties:
          description: "An array of strings representing the properties to be returned\
            \ for each object. If a specified property is not present on an object,\
            \ it will be ignored."
          items:
            type: string
          type: array
        propertiesWithHistory:
          description: "An array of strings representing the properties to be returned\
            \ along with their history of previous values. If a specified property\
            \ is not present on an object, it will be ignored."
          items:
            type: string
          type: array
      required:
      - inputs
      - properties
      - propertiesWithHistory
      type: object

openapi: 3.0.1
info:
  description: Basepom for all HubSpot Projects
  title: Companies
  version: 2026-09
  x-hubspot-api-use-case: "When a new customer signs up on your website with their\
    \ business email address, create a company record to represent the relationship\
    \ between the customer and the company they work for. A sales rep can later use\
    \ this company record for outreach to find other potential sales opportunities. "
  x-hubspot-introduction: Use the companies API to create and manage CRM records that
    represent the companies and organizations that interact with your business.
  x-hubspot-product-tier-requirements:
    cms: FREE
    commerce: FREE
    crmHub: FREE
    dataHub: FREE
    marketing: FREE
    sales: FREE
    service: FREE
servers:
- url: https://api.hubapi.com
tags:
- name: Advanced
- name: Basic
- name: Batch
- name: Search

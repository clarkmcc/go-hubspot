    Filter:
      description: "Defines a single condition for searching CRM objects, specifying\
        \ the property to filter on, the operator to use (such as equals, greater\
        \ than, or contains), and the value(s) to compare against. "
      example:
        highValue: highValue
        operator: BETWEEN
        propertyName: propertyName
        value: value
        values:
        - values
        - values
      properties:
        highValue:
          description: An optional string used in range-based filters to specify the
            upper bound of the range.
          type: string
        operator:
          description: "The operator used to compare the property with the value(s).\
            \ It is a string and valid operators include 'EQ', 'NEQ', 'LT', 'LTE',\
            \ 'GT', 'GTE', 'BETWEEN', 'IN', 'NOT_IN', 'HAS_PROPERTY', 'NOT_HAS_PROPERTY',\
            \ 'CONTAINS_TOKEN', and 'NOT_CONTAINS_TOKEN'."
          enum:
          - BETWEEN
          - CONTAINS_TOKEN
          - EQ
          - GT
          - GTE
          - HAS_PROPERTY
          - IN
          - LT
          - LTE
          - NEQ
          - NOT_CONTAINS_TOKEN
          - NOT_HAS_PROPERTY
          - NOT_IN
          type: string
        propertyName:
          description: The name of the property on which the filter is applied. It
            is a string that specifies the field to be filtered.
          type: string
        value:
          description: The value to be used in the filter condition. It is a string
            that represents the specific value to match against the property.
          type: string
        values:
          description: "An array of strings used in filters that require multiple\
            \ values, such as 'IN' or 'NOT_IN'."

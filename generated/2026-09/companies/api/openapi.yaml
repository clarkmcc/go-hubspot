components:
  responses:
    Error:
      content:
        '*/*':
          schema:
            $ref: "#/components/schemas/Error"
      description: An error occurred.
  schemas:
    AssociatedId:
      description: Contains the id and type of an association
      example:
        id: id
        type: deal_to_contact
      properties:
        id:
          description: The unique identifier for the association. It is a string.
          type: string
        type:
          description: "The type of the association, represented as a string."
          example: deal_to_contact
          type: string
      required:
      - id
      - type
      type: object
    AssociationSpec:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        associationCategory: HUBSPOT_DEFINED
        associationTypeId: 0
      properties:
        associationCategory:
          description: "For [labeled associations](https://developers.hubspot.com/docs/guides/api/crm/associations/associations-v4#associate-records-with-a-label),\
            \ the category of the association."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        associationTypeId:
          description: "The [association type ID](https://developers.hubspot.com/docs/guides/api/crm/associations/associations-v4#association-type-id-values)\
            \ (e.g., `4` for contact-to-company associations)."
          format: int32
          type: integer
      required:
      - associationCategory
      - associationTypeId
      type: object
    AssociationSpecWithLabel:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        category: HUBSPOT_DEFINED
        fromObjectTypeId: fromObjectTypeId
        label: label
        toObjectTypeId: toObjectTypeId
        typeId: 0
      properties:
        category:
          description: "The category of the association, indicating its origin. Valid\
            \ values include 'HUBSPOT_DEFINED', 'USER_DEFINED', 'INTEGRATOR_DEFINED',\
            \ and 'WORK'."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        fromObjectTypeId:
          description: The string identifier for the object type from which the association
            originates.
          type: string
        label:
          description: "A string that provides a label for the association, which\
            \ can be used to describe the nature of the relationship."
          type: string
        toObjectTypeId:
          description: The string identifier for the object type to which the association
            is directed.
          type: string
        typeId:
          description: An integer representing the unique identifier for the type
            of association.
          format: int32
          type: integer
      required:
      - category
      - typeId
      type: object
    BatchInputSimplePublicObjectBatchInput:
      description: "Represents a batch input component used to handle multiple simple\
        \ public objects in a single API request. This component is typically used\
        \ when performing batch operations to create, update, or delete multiple records\
        \ simultaneously."
      example:
        inputs:
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInput objects, each representing\
            \ a CRM object to be processed in the batch operation."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInput"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputForCreate:
      description: Represents a batch input for creating multiple simple public objects
        in a single request. This component is used to streamline the process of adding
        new objects to a HubSpot account by allowing multiple entries to be created
        at once.
      example:
        inputs:
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of objects to be created, each defined by the SimplePublicObjectBatchInputForCreate\
            \ schema."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputForCreate"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputUpsert:
      description: "Represents a batch input operation for upserting simple public\
        \ objects in HubSpot. This component is used to process multiple upsert operations\
        \ in a single request, improving efficiency and performance."
      example:
        inputs:
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties

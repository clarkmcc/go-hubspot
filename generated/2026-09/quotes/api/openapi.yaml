openapi: 3.0.1
info:
  description: Basepom for all HubSpot Projects
  title: Quotes
  version: 2026-09
  x-hubspot-api-use-case: Create a contract proposal for a customer who is interested
    in signing up for one of your annual SEO auditing service packages.
  x-hubspot-introduction: Use the quotes API to create and manage sales quotes for
    sharing pricing information with potential buyers.
  x-hubspot-product-tier-requirements:
    cms: FREE
    commerce: FREE
    crmHub: FREE
    dataHub: FREE
    marketing: FREE
    sales: FREE
    service: FREE
servers:
- url: https://api.hubapi.com
tags:
- name: Advanced
- name: Basic
- name: Batch
- name: Search
paths:
  /crm/objects/2026-09/quotes:
    get:
      description: Read a page of quotes. Control what is returned via the `properties`
        query param.
      operationId: GetQuotes
      parameters:
      - description: The paging cursor token of the last successfully read resource
          will be returned as the `paging.next.after` JSON property of a paged response
          containing more results.
        explode: true
        in: query
        name: after
        required: false
        schema:
          type: string
        style: form
      - description: Whether to return only results that have been archived.
        explode: true
        in: query
        name: archived
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "A comma separated list of object types to retrieve associated\
          \ IDs for. If any of the specified associations do not exist, they will\
          \ be ignored."
        explode: true
        in: query
        name: associations
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The maximum number of results to display per page.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          format: int32
          type: integer
        style: form
      - description: "A comma separated list of the properties to be returned in the\
          \ response. If any of the specified properties are not present on the requested\
          \ object(s), they will be ignored."
        explode: true
        in: query
        name: properties
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: "A comma separated list of the properties to be returned along\
          \ with their history of previous values. If any of the specified properties\
          \ are not present on the requested object(s), they will be ignored. Usage\
          \ of this parameter will reduce the maximum number of objects that can be\
          \ read by a single request."
        explode: true
        in: query
        name: propertiesWithHistory
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponseSimplePublicObjectWithAssociationsForwardPaging"
          description: successful operation
        default:
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Error"
          description: An error occurred.

components:
  responses:
    Error:
      content:
        '*/*':
          schema:
            $ref: "#/components/schemas/Error"
      description: An error occurred.
  schemas:
    AssociatedId:
      description: Contains the id and type of an association
      example:
        id: id
        type: deal_to_contact
      properties:
        id:
          description: The ID for the association type.
          type: string
        type:
          description: The type of association.
          example: deal_to_contact
          type: string
      required:
      - id
      - type
      type: object
    AssociationSpec:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        associationCategory: HUBSPOT_DEFINED
        associationTypeId: 0
      properties:
        associationCategory:
          description: "The category of the association, such as \"HUBSPOT_DEFINED\"\
            ."
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        associationTypeId:
          description: The ID representing the specific type of association.
          format: int32
          type: integer
      required:
      - associationCategory
      - associationTypeId
      type: object
    AssociationSpecWithLabel:
      description: "Defines the type, direction, and details of the relationship between\
        \ two CRM objects."
      example:
        category: HUBSPOT_DEFINED
        fromObjectTypeId: fromObjectTypeId
        label: label
        toObjectTypeId: toObjectTypeId
        typeId: 0
      properties:
        category:
          description: "Association category. Can be HUBSPOT_DEFINED, USER_DEFINED,\
            \ INTEGRATOR_DEFINED or WORK"
          enum:
          - HUBSPOT_DEFINED
          - INTEGRATOR_DEFINED
          - USER_DEFINED
          - WORK
          type: string
        fromObjectTypeId:
          description: A string representing the object type ID from which the association
            originates.
          type: string
        label:
          description: "A string representing the label for the association, which\
            \ is optional."
          type: string
        toObjectTypeId:
          description: A string representing the object type ID to which the association
            points.
          type: string
        typeId:
          description: An integer representing the unique identifier for the association
            type.
          format: int32
          type: integer
      required:
      - category
      - typeId
      type: object
    BatchInputSimplePublicObjectBatchInput:
      description: "Represents a batch input component used to handle multiple simple\
        \ public objects in a single API request. This component is typically used\
        \ when performing batch operations to create, update, or delete multiple records\
        \ simultaneously."
      example:
        inputs:
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: my_unique_property_name
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInput objects, each containing\
            \ the properties and identifiers for a CRM object to be updated."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInput"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputForCreate:
      description: Represents a batch input for creating multiple simple public objects
        in a single request. This component is used to streamline the process of adding
        new objects to a HubSpot account by allowing multiple entries to be created
        at once.
      example:
        inputs:
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - associations:
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          - to:
              id: id
            types:
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
            - associationCategory: HUBSPOT_DEFINED
              associationTypeId: 0
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
      properties:
        inputs:
          description: "An array of SimplePublicObjectBatchInputForCreate objects,\
            \ each containing the properties and associations for a single object\
            \ to be created."
          items:
            $ref: "#/components/schemas/SimplePublicObjectBatchInputForCreate"
          type: array
      required:
      - inputs
      type: object
    BatchInputSimplePublicObjectBatchInputUpsert:
      description: "Represents a batch input operation for upserting simple public\
        \ objects in HubSpot. This component is used to process multiple upsert operations\
        \ in a single request, improving efficiency and performance."
      example:
        inputs:
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
        - id: id
          idProperty: idProperty
          objectWriteTraceId: objectWriteTraceId
          properties:
            key: properties
